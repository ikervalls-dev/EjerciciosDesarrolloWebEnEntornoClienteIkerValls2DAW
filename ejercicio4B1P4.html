<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4</title>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var miDiv = document.getElementById("textoInteractivo");
            miDiv.addEventListener('mouseover', function() {
                this.style.fontSize = '16pt';
            });
            miDiv.addEventListener('mouseout', function() {
                this.style.fontSize = '12pt';
            });
        });
    </script>
</head>
<body>
    <div id="textoInteractivo" style="font-size: 12pt;">
        Al pasar por encima de este texto cambiará de tamaño
    </div>
</body>
</html>
